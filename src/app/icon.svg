<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sakuraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="60%" stop-color="#ff69b4" />
      <stop offset="100%" stop-color="#ff1493" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" mode="over" />
    </filter>
  </defs>
  
  <g transform="translate(50, 50)" filter="url(#glow)">
    <!-- 5 Sakura Petals with distinctive notched tip -->
    <!-- Petal 1 (0 deg) -->
    <path d="M 0 0 C -12 -22 -15 -42 -4 -46 C 0 -44 0 -44 0 -40 C 0 -44 0 -44 4 -46 C 15 -42 12 -22 0 0 Z" fill="url(#sakuraGrad)" />
    <!-- Petal 2 (72 deg) -->
    <path d="M 0 0 C -12 -22 -15 -42 -4 -46 C 0 -44 0 -44 0 -40 C 0 -44 0 -44 4 -46 C 15 -42 12 -22 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(72)" />
    <!-- Petal 3 (144 deg) -->
    <path d="M 0 0 C -12 -22 -15 -42 -4 -46 C 0 -44 0 -44 0 -40 C 0 -44 0 -44 4 -46 C 15 -42 12 -22 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(144)" />
    <!-- Petal 4 (216 deg) -->
    <path d="M 0 0 C -12 -22 -15 -42 -4 -46 C 0 -44 0 -44 0 -40 C 0 -44 0 -44 4 -46 C 15 -42 12 -22 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(216)" />
    <!-- Petal 5 (288 deg) -->
    <path d="M 0 0 C -12 -22 -15 -42 -4 -46 C 0 -44 0 -44 0 -40 C 0 -44 0 -44 4 -46 C 15 -42 12 -22 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(288)" />
    
    <!-- Flower Center Stamen -->
    <circle cx="0" cy="0" r="7" fill="#ff007f" />
    <circle cx="0" cy="0" r="4" fill="#ffd700" />
    
    <!-- Pistils -->
    <line x1="0" y1="0" x2="-6" y2="-10" stroke="#ff007f" stroke-width="1.5" />
    <circle cx="-6" cy="-10" r="1.5" fill="#ffd700" />
    <line x1="0" y1="0" x2="6" y2="-10" stroke="#ff007f" stroke-width="1.5" />
    <circle cx="6" cy="-10" r="1.5" fill="#ffd700" />
    <line x1="0" y1="0" x2="-10" y2="4" stroke="#ff007f" stroke-width="1.5" />
    <circle cx="-10" cy="4" r="1.5" fill="#ffd700" />
    <line x1="0" y1="0" x2="10" y2="4" stroke="#ff007f" stroke-width="1.5" />
    <circle cx="10" cy="4" r="1.5" fill="#ffd700" />
    <line x1="0" y1="0" x2="0" y2="11" stroke="#ff007f" stroke-width="1.5" />
    <circle cx="0" cy="11" r="1.5" fill="#ffd700" />
  </g>
</svg>
